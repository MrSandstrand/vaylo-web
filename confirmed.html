<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>You're in the loop – Vaylo</title><meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="48x48"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--ground:#FAF8F4;--ink:#13263A;--ink2:#4E6273;--sand:#B08D57;--blue:#5FA3F0}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:17px/1.6 Inter,"Segoe UI",system-ui,sans-serif;display:grid;place-items:center;padding:24px}
.card{max-width:520px;width:100%;background:#fff;border-radius:24px;padding:44px 36px 40px;text-align:center;box-shadow:0 30px 60px -30px rgba(19,38,58,.25)}
.drop{width:84px;height:84px;margin:0 auto 26px;border-radius:24px;background:var(--ink);display:grid;place-items:center;animation:pop .9s cubic-bezier(.2,.8,.2,1) both}
.drop svg{width:62px;height:62px}
@keyframes pop{0%{transform:scale(.6) translateY(10px);opacity:0}60%{transform:scale(1.05)}100%{transform:none;opacity:1}}
.k{font:700 12px/1 Inter,sans-serif;letter-spacing:2px;text-transform:uppercase;color:var(--sand);margin:0 0 12px}
h1{font:800 2.1rem/1.1 "Plus Jakarta Sans",Inter,sans-serif;letter-spacing:-.02em;margin:0 0 14px}
p{color:var(--ink2);margin:0 0 26px}
a.btn{display:inline-block;padding:15px 26px;border-radius:999px;background:var(--ink);color:#fff;text-decoration:none;font:700 13px/1 Inter,sans-serif;letter-spacing:1.5px;text-transform:uppercase}
.err{display:none}body.e .ok{display:none}body.e .err{display:block}
</style></head>
<body><script>if(/[?&]e=1/.test(location.search))document.body.className="e"</script>
<main class="card">
  <div class="drop"><svg viewBox="0 0 512 512" aria-hidden="true"><g transform="translate(-6 -4)"><path fill="#fff" d="M70 150 L148 150 Q166 150 174 166 L250 326 C268 276 296 214 326 176 Q346 152 380 150 L392 150 L392 250 L298 382 Q282 410 248 410 L216 410 Q186 410 174 384 Z"/><path d="M404 114 C415 142 442 170 442 205 A39 39 0 0 1 364 205 C364 170 393 142 404 114 Z" fill="#5FA3F0" stroke="#13263A" stroke-width="26" stroke-linejoin="round" paint-order="stroke"/></g></svg></div>
  <div class="ok">
    <p class="k">Confirmed</p>
    <h1>You're in the loop.</h1>
    <p>Thanks! We'll send you sneak peeks, launch news and early-bird offers while you wait. A handful of emails, never spam.</p>
  </div>
  <div class="err">
    <p class="k">Hmm</p>
    <h1>That link didn't work.</h1>
    <p>It may be old or already used. Email <a href="mailto:hello@getvaylo.io">hello@getvaylo.io</a> and we'll sort it out.</p>
  </div>
  <a class="btn" href="/?utm_source=confirm&amp;utm_medium=email">Back to Vaylo</a>
</main></body></html>
